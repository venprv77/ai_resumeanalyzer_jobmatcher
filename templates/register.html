<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<div class="container">

    <h1>Create Account</h1>

    {% with messages = get_flashed_messages() %}

        {% for message in messages %}

            <p class="message">
                {{ message }}
            </p>

        {% endfor %}

    {% endwith %}


    <form method="POST">

        <div class="form-group">

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

        </div>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <button type="submit">
            Register
        </button>

    </form>


    <p>
        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>
    </p>

</div>


<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
